<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">TaskTracker</div>
    <div class="auth-sub">Project management platform</div>
    <h1>Sign in</h1>
    @if (error) {
      <div class="error-msg">{{ error }}</div>
    }
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label>Email</label>
        <input class="form-control" type="email" formControlName="email" placeholder="you@company.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input class="form-control" type="password" formControlName="password" placeholder="••••••••" />
      </div>
      <button class="btn btn-primary" style="width:100%; justify-content:center; margin-top:0.5rem" type="submit" [disabled]="loading">
        @if (loading) { <span class="spinner"></span> } @else { Sign in }
      </button>
    </form>
    <p style="margin-top:1.5rem; text-align:center; color:var(--muted); font-size:0.8rem">
      No account? <a routerLink="/register" style="color:var(--accent)">Register</a>
    </p>
  </div>
</div>
