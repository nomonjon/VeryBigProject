<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">TaskTracker</div>
    <div class="auth-sub">Create your account</div>
    <h1>Register</h1>
    @if (error) { <div class="error-msg">{{ error }}</div> }
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label>Full Name</label>
        <input class="form-control" type="text" formControlName="fullName" placeholder="Jane Smith" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input class="form-control" type="email" formControlName="email" placeholder="you@company.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input class="form-control" type="password" formControlName="password" placeholder="Min 6 characters" />
      </div>
      <div class="form-group">
        <label>Position</label>
        <input class="form-control" type="text" formControlName="position" placeholder="Developer, Manager…" />
      </div>
      <button class="btn btn-primary" style="width:100%; justify-content:center; margin-top:0.5rem" type="submit" [disabled]="loading">
        @if (loading) { <span class="spinner"></span> } @else { Create account }
      </button>
    </form>
    <p style="margin-top:1.5rem; text-align:center; color:var(--muted); font-size:0.8rem">
      Already have an account? <a routerLink="/login" style="color:var(--accent)">Sign in</a>
    </p>
  </div>
</div>
